<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <link rel="stylesheet" href="./css/output.css">
    <title>Dynamic Text Preview</title>
</head>
<body class="h-dvh flex justify-center bg-gray-400 border-5">
      
    <section class=" flex flex-col  justify-center bg-gray-500 items-center w-[400] p-10">
        <div class="w-full mb-10 flex justify-center">
            <h1 id="h1" class=" cursor-pointer text-4xl mb-40"></h1>
        </div>
        <input class="bg-white border w-full rounded-2xl p-2" type="text" id="input">
        <div class="flex gap-4">
            <button id="btnB" class="btn bg-blue-300 hover:bg-gray-400 border-blue-700 text-blue-800">Azul</button>
            <button id="btnG" class="btn hover:bg-gray-400 border-green-700 text-green-800 bg-green-300">Verde</button>
            <button id="btnY" class="btn hover:bg-gray-400 border-yellow-700 text-yellow-800 bg-yellow-300">Amarelo</button>
            <button id="btnR" class="btn hover:bg-gray-400 border-red-700 text-red-800 bg-red-300">Vermelho</button>
        </div>
    </section>
    <script src="./js/script.js">   
    </script>
</body>
</html>
